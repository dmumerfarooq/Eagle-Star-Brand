    <script>
      // Defensively ensure window.fetch is writable to avoid "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {

              });
            }

        }

        // Intercept and swallow third-party extension errors like frame_ant or fetch setter conflicts
        window.addEventListener('error', function(event) {
          var isExtension = event.filename && event.filename.indexOf('chrome-extension://') !== -1;
          var isFetchError = event.message && event.message.indexOf('Cannot set property fetch') !== -1;
          var isFrameAnt = (event.filename && event.filename.indexOf('frame_ant') !== -1) ||

          if (isExtension || isFetchError || isFrameAnt) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (reason) {
            var msg = (reason && reason.message) ? reason.message : String(reason);
            var stack = (reason && reason.stack) ? reason.stack : '';
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              stack.indexOf('chrome-extension://') !== -1 ||
              stack.indexOf('frame_ant') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
            }
          }
        }, true);
      })();
